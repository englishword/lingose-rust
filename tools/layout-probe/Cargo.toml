[package]
name = "lingose-layout-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[features]
default = []
static = []
static-hash = []
gzip = ["dep:flate2"]
hash = ["dep:flate2"]

[dependencies]
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
