name: CLI release candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v0.2.0]
  pull_request:
    branches: [main]

# CLI5 builds and uploads CI artifacts only. Release publication belongs to CLI6.
permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.93.1
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.93.1 --profile minimal --target '${{ matrix.target }}'
      - name: Build, test and run isolated native smoke
        run: python tools/check_cli_release.py --target ${{ matrix.target }} --output ci-evidence/${{ matrix.target }}
      - name: Retain candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli51-${{ matrix.target }}-${{ github.sha }}
          path: ci-evidence/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
